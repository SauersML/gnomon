name: Rust Test CI

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.config/nextest.toml'
      - '.github/workflows/test.yml'
      - 'cli/**'
      - 'terms/**'
      - 'tests/**'
      - 'data/testdata/**'
      - 'shared/**'
      - 'shared/**/*.rs'
      - 'score/**'
      - 'score/tests/**'
      - 'calibrate/**'
      - 'map/**'
      - 'map/**/*.rs'
      - 'map/*.rs'
      # Documentation-only changes do not need the Rust suite. Negative
      # patterns are applied in order, so this trims markdown out of the
      # directory globs above without narrowing them for source.
      - '!**/*.md'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.config/nextest.toml'
      - '.github/workflows/test.yml'
      - 'cli/**'
      - 'terms/**'
      - 'tests/**'
      - 'data/testdata/**'
      - 'shared/**'
      - 'shared/**/*.rs'
      - 'score/**'
      - 'score/tests/**'
      - 'calibrate/**'
      - 'map/**'
      - 'map/**/*.rs'
      - 'map/*.rs'
      # Documentation-only changes do not need the Rust suite. Negative
      # patterns are applied in order, so this trims markdown out of the
      # directory globs above without narrowing them for source.
      - '!**/*.md'
  workflow_dispatch:  # Manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # Artifacts run on different hosted CPUs. Native code generation can emit
  # instructions unavailable on the runner that receives the executable.
  RUSTFLAGS: '-C target-cpu=x86-64'
  # ubuntu-latest is 4 vCPU / 16 GB and this crate graph is heavy -- burn, polars,
  # arrow, faer, noodles. The release profile compounds it: lto = "fat" with
  # codegen-units = 1 hands the linker every crate at once as a single unit, which is
  # where both the memory and the hours go.
  #
  # Capping rustc parallelism alone was not enough and traded one death for another:
  # exit 137 (the runner's OOM killer) became exit 143 (SIGTERM) at 2h13m. The suite has
  # not actually run since 2026-08-20 either way.
  #
  # Thin LTO with 16 codegen units is the lever that matters -- it is what makes the
  # link fit in the runner at all. These are CI-only environment overrides: Cargo.toml
  # keeps fat LTO, so released binaries are unaffected. Benchmark numbers taken from
  # THIS workflow are thin-LTO numbers and not comparable to a release build; a CI that
  # never finishes produces no numbers to compare anyway.
  CARGO_BUILD_JOBS: 3
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Prepare cache metadata
        id: cache_meta
        shell: bash
        run: |
          echo "week=$(date -u +%G%V)" >> "$GITHUB_OUTPUT"
          DEPS_HASH=$(find . -name "Cargo.toml" -o -name "Cargo.lock" | sort | xargs cat | sha256sum | cut -d' ' -f1)
          echo "deps_hash=$DEPS_HASH" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo registry (CI speed only)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ steps.cache_meta.outputs.deps_hash }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache release builds
        uses: actions/cache@v4
        with:
          path: |
            target/release
            target/nextest
          key: ${{ runner.os }}-cargo-release-portable-${{ steps.cache_meta.outputs.deps_hash }}-W${{ steps.cache_meta.outputs.week }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-portable-${{ steps.cache_meta.outputs.deps_hash }}-W${{ steps.cache_meta.outputs.week }}-
            ${{ runner.os }}-cargo-release-portable-${{ steps.cache_meta.outputs.deps_hash }}-
            ${{ runner.os }}-cargo-release-portable-
            ${{ runner.os }}-cargo-release-${{ steps.cache_meta.outputs.deps_hash }}-
            ${{ runner.os }}-cargo-release-

      - name: Cache profiling builds
        uses: actions/cache@v4
        with:
          path: target/profiling
          key: ${{ runner.os }}-cargo-profiling-portable-${{ steps.cache_meta.outputs.deps_hash }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-profiling-portable-${{ steps.cache_meta.outputs.deps_hash }}-
            ${{ runner.os }}-cargo-profiling-portable-

      # -------------------- PREWARM EVERYTHING (so artifacts are complete) --------------------
      - name: Cargo fetch (prepopulate deps cache)
        run: cargo +nightly fetch

      - name: Install cargo-nextest
        run: |
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Build and archive release tests
        run: |
          cargo +nightly nextest archive --profile ci --release --archive-file rust-tests-release.tar.zst

      - name: Build Gnomon binaries (Release and Profiling)
        run: |
          cargo +nightly build --release --bin gnomon
          cargo +nightly build --profile profiling --bin gnomon
      # ----------------------------------------------------------------------------------------

      # -------------------- EXPORT: GATHER ONLY ESSENTIAL METADATA --------------------
      - name: Compute safe artifact names (always)
        id: naming
        if: always()
        shell: bash
        run: |
          SAFE_REF="$(printf '%s' "${GITHUB_REF_NAME:-unknown}" | tr -c 'A-Za-z0-9_.-' '-')"
          SHORT_SHA="$(printf '%.12s' "${GITHUB_SHA}")"
          echo "safe_ref=$SAFE_REF" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Collect build metadata (always)
        if: always()
        shell: bash
        run: |
          mkdir -p export
          {
            echo "branch=${GITHUB_REF_NAME}"
            echo "branch_sanitized=${{ steps.naming.outputs.safe_ref }}"
            echo "commit=${GITHUB_SHA}"
            echo "short_commit=${{ steps.naming.outputs.short_sha }}"
            echo "week=${{ steps.cache_meta.outputs.week }}"
            echo "deps_hash=${{ steps.cache_meta.outputs.deps_hash }}"
            echo ""
            echo "--- rustc ---"
            (rustc +nightly -Vv || true)
            echo ""
            echo "--- cargo ---"
            (cargo +nightly -Vv || true)
            echo ""
            echo "--- host uname ---"
            (uname -a || true)
          } > export/build-meta.txt

      - name: Upload artifact – build metadata (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-meta-${{ steps.naming.outputs.safe_ref }}-${{ steps.naming.outputs.short_sha }}
          path: export/build-meta.txt
          retention-days: 30

      - name: Prepare executable artifacts
        shell: bash
        run: |
          rm -rf build-output
          mkdir -p build-output/target/release build-output/target/profiling
          cp target/release/gnomon build-output/target/release/
          cp target/profiling/gnomon build-output/target/profiling/

      - name: Cleanup workspace leftovers (always)
        if: always()
        run: |
          rm -rf export
          du -sh build-output || true


      - name: Upload build artifacts for all downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output
          retention-days: 1
          if-no-files-found: error

      - name: Upload test build artifacts for parallel runs
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-build
          path: rust-tests-release.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  rust_tests:
    needs: build_and_test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            filter_expr: "not test(calibrate::) and not test(map::) and not (test(score::) or binary(=score))"
          - suite: score
            filter_expr: "test(score::) or binary(=score)"
          - suite: calibrate
            filter_expr: "test(calibrate::)"
          - suite: map
            filter_expr: "test(map::)"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Download test build artifacts
        uses: actions/download-artifact@v4
        with:
          name: rust-test-build
          path: .

      - name: Install cargo-nextest
        run: |
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Run nextest
        id: nextest
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly nextest run --profile ci \
            --archive-file rust-tests-release.tar.zst \
            --workspace-remap "$GITHUB_WORKSPACE" --extract-to "$GITHUB_WORKSPACE" \
            --filter-expr "${{ matrix.filter_expr }}" \
            2>&1 | tee cargo-test.log

  python_test_integration:
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .
      - name: Verify build artifact
        run: test -s target/release/gnomon

      - uses: actions/setup-python@v7
        with: { python-version: '3.13' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-integration-${{ hashFiles('score/tests/test.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-integration-
      - run: pip install pandas numpy requests psutil tabulate polars pyarrow
      - run: chmod +x target/release/gnomon
      - run: python -u score/tests/test.py

  python_test_simulation:
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .
      - name: Verify build artifact
        run: test -s target/release/gnomon

      - uses: actions/setup-python@v7
        with: { python-version: '3.13' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-simulation-${{ hashFiles('score/tests/sim_test.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-simulation-
      - run: pip install pandas numpy requests psutil tabulate polars pyarrow pytest
      - name: Verify simulation generator and oracle
        run: python -m pytest -q score/tests/test_sim_helpers.py
      - run: chmod +x target/release/gnomon
      - name: Install PLINK2
        run: |
          curl --fail --show-error --location \
            https://s3.amazonaws.com/plink2-assets/alpha7/plink2_linux_avx2_20260818.zip \
            --output plink2.zip
          unzip plink2.zip plink2
          sudo mv plink2 /usr/local/bin/
      - id: sim_test
        run: python -u score/tests/sim_test.py
      - if: failure()
        run: |
          echo "The simulation test failed. Checking for OOM errors in kernel logs..."
          sudo dmesg | grep -i -E 'killed process|out of memory' || echo "No OOM messages found."

  python_test_benchmark:
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .
      - name: Verify build artifact
        run: test -s target/release/gnomon

      - uses: actions/setup-python@v7
        with: { python-version: '3.13' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-benchmark-${{ hashFiles('score/tests/bench.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-benchmark-
      - run: pip install pandas numpy requests psutil tabulate polars pyarrow
      - run: chmod +x target/release/gnomon
      - run: python -u score/tests/bench.py

  performance_reports:
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .
      - name: Verify build artifact
        run: test -s target/release/gnomon

      - name: Ensure profiling binary is available
        shell: bash
        run: |
          set -euo pipefail
          test -f target/profiling/gnomon
          chmod +x target/profiling/gnomon

      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }

      - name: Install Python dependencies
        run: pip install pandas numpy requests psutil

      - name: System Diagnostics
        run: |
          echo "--- System Information ---"
          echo "Kernel: $(uname -a)"
          echo "Distribution: $(lsb_release -a || true)"
          echo "CPU Cores: $(nproc)"
          echo "--- Memory ---"
          free -h
          echo "------------------------"

      - name: Get Kernel Version for Cache Key
        id: kernel_version
        run: echo "version=$(uname -r)" >> $GITHUB_OUTPUT

      - name: Cache APT packages for perf
        id: apt_cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-perf-tools-cache-${{ steps.kernel_version.outputs.version }}

      - name: Install Perf Tools
        run: |
          set -euo pipefail

          CURRENT_KERNEL=$(uname -r)
          KERNEL_NO_FLAVOR=${CURRENT_KERNEL%%-*}
          KERNEL_MAJOR_MINOR=$(echo "$CURRENT_KERNEL" | cut -d. -f1-2)

          if [ "${{ steps.apt_cache.outputs.cache-hit }}" != 'true' ]; then
            sudo apt-get update -y
          fi

          install_pkg_if_available() {
            local pkg="$1"
            if apt-cache policy "$pkg" 2>/dev/null | grep -q 'Candidate: (none)'; then
              echo "Skipping unavailable package: $pkg"
              return 1
            else
              sudo apt-get install -y --no-install-recommends "$pkg"
              return 0
            fi
          }

          install_pkg_if_available linux-tools-common

          HAVE_KERNEL_TOOLS=0
          if install_pkg_if_available "linux-tools-${CURRENT_KERNEL}"; then
            HAVE_KERNEL_TOOLS=1
          fi
          install_pkg_if_available "linux-cloud-tools-${CURRENT_KERNEL}" || true

          # Fallback only when running-kernel packages are unavailable.
          # Installing azure meta packages unconditionally can upgrade kernel packages
          # during the job without reboot, leaving perf mismatched to uname -r.
          if [ "$HAVE_KERNEL_TOOLS" -eq 0 ]; then
            install_pkg_if_available linux-tools-azure || true
            install_pkg_if_available linux-cloud-tools-azure || true
          fi

          ensure_perf_symlink() {
            local candidate
            for candidate in \
              "/usr/bin/perf_${CURRENT_KERNEL}" \
              "/usr/bin/perf_${KERNEL_NO_FLAVOR}" \
              "/usr/bin/perf_${KERNEL_MAJOR_MINOR}" \
              "/usr/lib/linux-tools-${CURRENT_KERNEL}/perf" \
              "/usr/lib/linux-tools-${KERNEL_NO_FLAVOR}/perf" \
              "/usr/lib/linux-tools-${KERNEL_MAJOR_MINOR}/perf"; do
              if [ -x "$candidate" ]; then
                echo "Linking perf from $candidate"
                sudo ln -sf "$candidate" /usr/local/bin/perf
                return 0
              fi
            done

            candidate=$(find /usr/lib/linux-tools -maxdepth 2 -type f -name perf -print -quit 2>/dev/null || true)
            if [ -n "$candidate" ]; then
              echo "Linking perf from $candidate"
              sudo ln -sf "$candidate" /usr/local/bin/perf
              return 0
            fi

            return 1
          }

          # `perf` may exist but still fail (wrapper mismatch for running kernel).
          # Always try to point PATH at a concrete perf binary when possible.
          ensure_perf_symlink || true
          hash -r || true

          if ! command -v perf >/dev/null 2>&1; then
            ensure_perf_symlink || true
          fi

          if ! command -v perf >/dev/null 2>&1; then
            echo "::error::perf binary not found after installation attempts"
            exit 1
          fi

          if ! perf --version >/dev/null 2>&1; then
            echo "perf command exists but failed; retrying symlink resolution..."
            ensure_perf_symlink || true
            hash -r || true
          fi

          if ! perf --version >/dev/null 2>&1; then
            echo "::error::perf is present but unusable for kernel ${CURRENT_KERNEL}"
            command -v perf || true
            perf --version || true
            exit 1
          fi

          perf --version

      - name: Configure Profiler Permissions
        run: |
          sudo sh -c 'echo -1 > /proc/sys/kernel/perf_event_paranoid'
          sudo sh -c 'echo 0 > /proc/sys/kernel/kptr_restrict'

      - name: Run Profiling Harness
        run: python score/tests/perf.py

      - name: Grant Cache Permissions
        if: always()
        run: sudo chown -R runner:runner /var/cache/apt/archives /var/lib/apt/lists

      - name: Upload Profiling Data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-data-${{ github.run_id }}
          path: perf.data
          if-no-files-found: ignore
