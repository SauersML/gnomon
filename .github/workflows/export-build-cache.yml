name: Export Rust Build Cache

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: Exact release build cache key to export for remote development
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: export-rust-build-cache
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Match Rust Test CI's cache paths exactly: they contribute to the cache
      # version, independently of its user-visible key.
      - name: Restore the existing release cache
        uses: actions/cache/restore@v4
        with:
          path: |
            target/release
            target/nextest
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true

      - name: Pack cache with executable permissions intact
        run: tar --zstd -cf rust-build-cache.tar.zst target

      - name: Export cache for remote download
        uses: actions/upload-artifact@v4
        with:
          name: rust-build-cache
          path: rust-build-cache.tar.zst
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
