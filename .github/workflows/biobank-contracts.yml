name: Biobank study contracts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'examples/biobank/**'
      - 'sims/ancestry_calibration/**'
      - '.github/workflows/biobank-contracts.yml'
  pull_request:
    paths:
      - 'examples/biobank/**'
      - 'sims/ancestry_calibration/**'
      - '.github/workflows/biobank-contracts.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workflow validation dependencies
        run: >-
          pip install --only-binary=:all: numpy pandas scipy scikit-learn pyarrow duckdb sqlglot
          google-cloud-bigquery google-cloud-storage miniwdl pytest
      # The study's own tests: imports, score parsing, schemas, SQL, disclosure,
      # evaluation and the simulator. The fits in test_study_models_binary.py
      # need the study's gamfit wheel and test_study_evaluate_reference.py needs
      # R with the survival packages, so those two run on MSI.
      - name: Validate study contracts
        working-directory: examples/biobank
        run: |
          python -m pytest -q -p no:cacheprovider test_*.py tests \
            --ignore=tests/test_study_models_binary.py --ignore=tests/test_study_evaluate_reference.py
          for wdl in *.wdl; do timeout 45 python -m WDL check "$wdl"; done
      - name: Validate simulation completion contracts
        working-directory: sims/ancestry_calibration
        run: timeout 45 python -m unittest -v test_study_contract
