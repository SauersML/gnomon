name: Biobank workflow contracts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'examples/biobank/**'
      - 'sims/ancestry_calibration/**'
      - '.github/workflows/biobank-contracts.yml'
  pull_request:
    paths:
      - 'examples/biobank/**'
      - 'sims/ancestry_calibration/**'
      - '.github/workflows/biobank-contracts.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workflow validation dependencies
        run: >-
          pip install --only-binary=:all: numpy pandas scipy scikit-learn pyarrow
          google-cloud-bigquery google-cloud-storage miniwdl pytest
      # Every test module and every WDL: a stale test outside test_aou_survival
      # once sent SIGKILL to every process its account owned on a shared node.
      - name: Validate prospective workflow contracts
        working-directory: examples/biobank
        run: |
          timeout 180 python -m pytest -q -p no:cacheprovider test_*.py
          for wdl in *.wdl; do timeout 45 python -m WDL check "$wdl"; done
      - name: Validate simulation completion contracts
        working-directory: sims/ancestry_calibration
        run: timeout 45 python -m unittest -v test_study_contract
