name: AoU Scorer Runtime

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: Existing Rust Test CI build cache
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aou-scorer-runtime
  cancel-in-progress: false

jobs:
  scorer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTFLAGS: '-C target-cpu=x86-64'
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      GNOMON_RELEASE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-10
      - uses: actions/cache/restore@v4
        with:
          path: |
            target/release
            target/nextest
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - name: Resolve source packages for the restored build cache
        run: timeout --kill-after=5s 60s cargo +nightly-2026-09-10 fetch --locked
      - name: Build the portable scorer from the existing release graph
        run: |
          set -euo pipefail
          # Use the persisted scorer cache; do not compile mapping or model
          # fitting into a binary that only performs genotype scoring.
          # Source regressions run on MSI; changing the CPU target additionally
          # requires public-fixture parity before staging this artifact in AoU.
          cat > rustc-iteration.sh <<'SH'
          #!/bin/sh
          exec "$@" -C lto=off -C codegen-units=64 -C "incremental=$PWD/target/release/aou-incremental"
          SH
          chmod +x rustc-iteration.sh
          export RUSTC_WORKSPACE_WRAPPER="$PWD/rustc-iteration.sh"
          timeout --kill-after=10s 180s cargo +nightly-2026-09-10 build --locked --offline --release \
            --no-default-features --features score,reqwest/rustls-tls --bin gnomon-score
      - name: Preserve completed compilation after success or interruption
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            target/release
            target/nextest
          key: Linux-aou-scorer-x86-64-nightly-20260910-${{ github.run_id }}
      - name: Validate and package the Linux runtime
        run: |
          set -euo pipefail
          mkdir runtime
          cp target/release/gnomon-score runtime/gnomon-score
          docker pull python:3.12-slim-trixie
          docker image inspect python:3.12-slim-trixie --format '{{index .RepoDigests 0}}' > runtime-image.txt
          docker run --rm -v "$PWD/runtime:/runtime:ro" "$(cat runtime-image.txt)" \
            /runtime/gnomon-score --help
          sha256sum runtime/gnomon-score > scorer.sha256
          tar -czf scorer.tar.gz -C runtime gnomon-score
          sha256sum scorer.tar.gz > archive.sha256
      - name: Prove remote-range parity on the public fixture
        run: |
          set -euo pipefail
          # The same binary must score identical values whether it reads the
          # fixture from disk or through planned HTTP range requests. Every
          # other variant is scored so each required row is its own range.
          mkdir -p parity/local parity/remote
          cp data/testdata/ld.bed data/testdata/ld.bim data/testdata/ld.fam parity/local/
          python3 - <<'PY'
          from pathlib import Path
          rows = [line.split() for line in Path('data/testdata/ld.bim').read_text().splitlines()]
          lines = [f'{row[0]}:{row[3]}\t{row[4]}\t{row[5]}\t{(i % 7 - 3) / 100:.17g}\n'
                   for i, row in enumerate(rows) if i % 2 == 0]
          Path('parity/weights.tsv').write_text(
              'variant_id\teffect_allele\tother_allele\tPGS004525\n' + ''.join(lines))
          ids = [line.split()[1] for line in Path('data/testdata/ld.fam').read_text().splitlines()]
          Path('parity/keep.txt').write_text('\n'.join(ids[:40]) + '\n')
          PY
          python3 scripts/range_http_server.py data/testdata 8765 &
          server=$!
          for _ in $(seq 50); do curl -sfI http://127.0.0.1:8765/ld.bed >/dev/null && break; sleep 0.2; done
          (cd parity/local && timeout --kill-after=5s 120s ../../runtime/gnomon-score \
            ../weights.tsv ld.bed --keep ../keep.txt --emit-components)
          (cd parity/remote && timeout --kill-after=5s 120s ../../runtime/gnomon-score \
            ../weights.tsv http://127.0.0.1:8765/ld.bed --keep ../keep.txt --emit-components 2> scorer.log \
            || { cat scorer.log; exit 1; })
          kill "$server"
          grep 'Remote BED read plan' parity/remote/scorer.log
          grep -q 'Remote BED read plan: 750 required rows of 50 B in 750 ranges' parity/remote/scorer.log
          local_out=$(find parity/local -name '*.sscore')
          remote_out=$(find parity/remote -name '*.sscore')
          test -n "$local_out" && test -n "$remote_out"
          cmp "$local_out" "$remote_out"
          test "$(grep -vc '^#' "$remote_out")" -eq 40
          echo "Remote planned reads reproduce local scores for 40 kept samples."
      - uses: actions/upload-artifact@v4
        with:
          name: aou-scorer-runtime
          path: |
            scorer.tar.gz
            scorer.sha256
            archive.sha256
            runtime-image.txt
          if-no-files-found: error
          retention-days: 7
