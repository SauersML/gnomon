name: AoU Scorer Runtime

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: Build cache to restore; the default reuses the newest scorer cache
        required: false
        type: string
        default: Linux-aou-scorer-x86-64-nightly-20260910-

permissions:
  contents: read

concurrency:
  group: aou-scorer-runtime
  cancel-in-progress: false

jobs:
  scorer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUSTFLAGS: '-C target-cpu=x86-64'
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      GNOMON_RELEASE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-10
      # A cache only shortens the build. Caches are evicted without notice,
      # so a cold build must still succeed; it then reseeds the cache below.
      - uses: actions/cache/restore@v4
        with:
          path: |
            target/release
            target/nextest
          key: ${{ inputs.cache_key }}
          restore-keys: |
            Linux-aou-scorer-x86-64-nightly-20260910-
      - name: Resolve source packages for the restored build cache
        run: timeout --kill-after=5s 60s cargo +nightly-2026-09-10 fetch --locked
      - name: Build the portable scorer
        run: |
          set -euo pipefail
          # Do not compile mapping or model fitting into a binary that only
          # performs genotype scoring.
          # Source regressions run on MSI; changing the CPU target additionally
          # requires public-fixture parity before staging this artifact in AoU.
          cat > rustc-iteration.sh <<'SH'
          #!/bin/sh
          exec "$@" -C lto=off -C codegen-units=64 -C "incremental=$PWD/target/release/aou-incremental"
          SH
          chmod +x rustc-iteration.sh
          export RUSTC_WORKSPACE_WRAPPER="$PWD/rustc-iteration.sh"
          timeout --kill-after=10s 30m cargo +nightly-2026-09-10 build --locked --offline --release \
            --no-default-features --features score,reqwest/rustls-tls --bin gnomon-score
      - name: Preserve completed compilation after success or interruption
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            target/release
            target/nextest
          key: Linux-aou-scorer-x86-64-nightly-20260910-${{ github.run_id }}
      - name: Validate and package the Linux runtime
        run: |
          set -euo pipefail
          mkdir runtime
          cp target/release/gnomon-score runtime/gnomon-score
          docker pull python:3.12-slim-trixie
          docker image inspect python:3.12-slim-trixie --format '{{index .RepoDigests 0}}' > runtime-image.txt
          docker run --rm -v "$PWD/runtime:/runtime:ro" "$(cat runtime-image.txt)" \
            /runtime/gnomon-score --help
          sha256sum runtime/gnomon-score > scorer.sha256
          tar -czf scorer.tar.gz -C runtime gnomon-score
          sha256sum scorer.tar.gz > archive.sha256
      - name: Prove remote-range parity on the public fixture
        run: |
          set -euo pipefail
          # The same binary must score the fixture alike whether it reads it from
          # disk or through HTTP range requests. The fixture is within one 8 MiB
          # block, so the remote reader fetches it whole in a single request; every
          # other variant is scored. One thread fixes the summation order, so reader
          # parity is exact bytes there. At the default thread count the order varies
          # from run to run even on disk, so that pair is compared numerically.
          mkdir -p parity/local parity/remote parity/local-1thread parity/remote-1thread
          for directory in local local-1thread; do
            cp data/testdata/ld.bed data/testdata/ld.bim data/testdata/ld.fam "parity/$directory/"
          done
          python3 - <<'PY'
          from pathlib import Path
          rows = [line.split() for line in Path('data/testdata/ld.bim').read_text().splitlines()]
          lines = [f'{row[0]}:{row[3]}\t{row[4]}\t{row[5]}\t{(i % 7 - 3) / 100:.17g}\n'
                   for i, row in enumerate(rows) if i % 2 == 0]
          Path('parity/weights.tsv').write_text(
              'variant_id\teffect_allele\tother_allele\tPGS004525\n' + ''.join(lines))
          ids = [line.split()[1] for line in Path('data/testdata/ld.fam').read_text().splitlines()]
          Path('parity/keep.txt').write_text('\n'.join(ids[:40]) + '\n')
          PY
          python3 scripts/range_http_server.py data/testdata 8765 &
          server=$!
          for _ in $(seq 50); do curl -sfI http://127.0.0.1:8765/ld.bed >/dev/null && break; sleep 0.2; done
          score() {
            directory=$1 genotype=$2
            shift 2
            (cd "parity/$directory" && env "$@" timeout --kill-after=5s 120s ../../runtime/gnomon-score \
              ../weights.tsv "$genotype" --keep ../keep.txt --emit-components 2> scorer.log \
              || { cat scorer.log; exit 1; })
          }
          score local ld.bed
          score remote http://127.0.0.1:8765/ld.bed
          score local-1thread ld.bed RAYON_NUM_THREADS=1
          score remote-1thread http://127.0.0.1:8765/ld.bed RAYON_NUM_THREADS=1
          kill "$server"
          grep 'Remote BED read whole' parity/remote/scorer.log
          grep -q 'Remote BED read whole: 75003 B in one request' parity/remote/scorer.log
          grep -q 'Remote BED read whole: 75003 B in one request' parity/remote-1thread/scorer.log
          sscore() {
            found=$(find "parity/$1" -name '*.sscore')
            test "$(printf '%s\n' "$found" | grep -c .)" -eq 1
            printf '%s\n' "$found"
          }
          local_out=$(sscore local)
          remote_out=$(sscore remote)
          local_1thread=$(sscore local-1thread)
          remote_1thread=$(sscore remote-1thread)
          # Evaluate both properties before failing, so one run says which of them broke.
          broken=0
          if ! cmp "$local_1thread" "$remote_1thread"; then
            echo "::error::Reader parity broke: one-thread .sscore bytes differ between local and remote reads."
            broken=1
          fi
          if ! python3 scripts/compare_sscore.py "$local_out" "$remote_out"; then
            echo "::error::Default-thread scores broke: local and remote differ in an id or count, or beyond 1e-10 relative."
            broken=1
          fi
          test "$broken" -eq 0
          test "$(grep -vc '^#' "$remote_out")" -eq 40
          echo "Remote reads reproduce local scores for 40 kept samples: exact bytes at one thread, within 1e-10 at default threads."
      - uses: actions/upload-artifact@v4
        with:
          name: aou-scorer-runtime
          path: |
            scorer.tar.gz
            scorer.sha256
            archive.sha256
            runtime-image.txt
          if-no-files-found: error
          retention-days: 7
