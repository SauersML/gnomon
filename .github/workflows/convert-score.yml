name: Convert consumer genomes and score examples

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'examples/misc/convert_score.py'
      - 'examples/tests/test_convert_score.py'
      - 'tests/gnomon_all_parity.sh'
      - 'score/**'
      - 'cli/convert_genome.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/convert-score.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'examples/misc/convert_score.py'
      - 'examples/tests/test_convert_score.py'
      - 'tests/gnomon_all_parity.sh'
      - 'score/**'
      - 'cli/convert_genome.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/convert-score.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # Share Rust Test CI's portable build artifacts and memory-bounded profile.
  RUSTFLAGS: '-C target-cpu=x86-64'
  CARGO_BUILD_JOBS: 3
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16

jobs:
  run-example:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run example and harness regression tests
        run: |
          python -m pip install pytest
          python -m pytest -q examples/tests

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Prepare shared cache metadata
        id: cache_meta
        shell: bash
        run: |
          echo "week=$(date -u +%G%V)" >> "$GITHUB_OUTPUT"
          DEPS_HASH=$(find . -name "Cargo.toml" -o -name "Cargo.lock" | sort | xargs cat | sha256sum | cut -d' ' -f1)
          echo "deps_hash=$DEPS_HASH" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ steps.cache_meta.outputs.deps_hash }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # The test workflow owns cache writes so a binary-only build cannot win
      # a race and replace the complete test cache with a partial build graph.
      - name: Restore Rust Test CI release build
        uses: actions/cache/restore@v4
        with:
          path: |
            target/release
            target/nextest
          key: ${{ runner.os }}-cargo-release-portable-${{ steps.cache_meta.outputs.deps_hash }}-W${{ steps.cache_meta.outputs.week }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-portable-${{ steps.cache_meta.outputs.deps_hash }}-W${{ steps.cache_meta.outputs.week }}-
            ${{ runner.os }}-cargo-release-portable-${{ steps.cache_meta.outputs.deps_hash }}-
            ${{ runner.os }}-cargo-release-portable-
            ${{ runner.os }}-cargo-release-${{ steps.cache_meta.outputs.deps_hash }}-
            ${{ runner.os }}-cargo-release-

      - name: Build gnomon and its pinned converter
        run: cargo +nightly build --release --bin gnomon --bin convert_genome

      - name: Add binaries to PATH (prefer local build)
        run: |
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"

      - name: Run convert_score example
        run: python examples/misc/convert_score.py
