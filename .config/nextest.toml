# cargo-nextest configuration
# See: https://nexte.st/book/configuration.html

[profile.default]
# The full release shards finish in under a minute. Report stalled tests early
# and leave two minutes for slower hosts without permitting hour-long hangs.
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
# For CI: continue running all tests even if some fail
fail-fast = false
