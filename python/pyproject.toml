[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "gnomon-pgs"
version = "0.1.0"
description = "Python bindings for SauersML/gnomon (high-performance polygenic score engine)."
readme = "README.md"
license = "AGPL-3.0-or-later"
# The license file is the repo-root LICENSE, which maturin already includes via
# the Cargo manifest (manifest-path = "../Cargo.toml"). Don't also declare a
# python/LICENSE here: the sdist would map both to the same path and abort
# ("LICENSE was already added"). The SPDX `license` expression above is the
# canonical license metadata for the wheel.
authors = [{ name = "SauersML" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["genomics", "bioinformatics", "polygenic-score", "pgs", "plink", "vcf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/SauersML/gnomon"
Issues = "https://github.com/SauersML/gnomon/issues"

[tool.maturin]
# The Rust crate lives at the repo root; build the `python` feature into the
# `cdylib`, which produces the native in-process extension module imported as
# `gnomon._gnomon`. `python-source = "."` puts the package initializer beside
# that extension in the wheel.
manifest-path = "../Cargo.toml"
module-name = "gnomon._gnomon"
python-source = "."
features = ["python"]
